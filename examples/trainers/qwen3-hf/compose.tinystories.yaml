# Demo recipe: Qwen3 from scratch on TinyStories for local vLLM inference.
# 9,156 x 32 x 512 = 150,011,904 tokens (~3 hours on GB10).
# Artifacts are used locally; this is not a distributable model release.
# The cuda lock covers Linux aarch64 and x86_64; adjust stage execution for GPU memory.
kind: waldo-model-compose
schema: 2
trainer:
  source: &application
    repository: https://github.com/kyleishie/waldo.git
    commit: f9c2f5bdfd90145400b469ad5c89b6154b4f553b
    path: examples/trainers/qwen3-hf
  environment: cuda
  determinism: best-effort
tokenizer:
  source: *application
  environment: tokenizer
  configuration: {}
architecture:
  vocab_size: 151936
  hidden_size: 384
  intermediate_size: 1152
  num_hidden_layers: 6
  num_attention_heads: 6
  num_key_value_heads: 2
  head_dim: 64
  max_position_embeddings: 512
  tie_word_embeddings: true
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    corpora: [core/synthetic/tinystories-reference]
    data:
      tokens: 150011904
      global_batch_sequences: 32
      sequence_length: 512
      seed: 42
      checkpoint_every: 250
      evaluate_every: 250
      evaluation_max_records: 128
      evaluation_max_bytes: 524288
    trainer:
      learning_rate: 0.0003
      lr_scheduler_type: cosine
      optim: adamw_torch
      init_seed: 42
      bf16: true
      warmup_steps: 300
    execution:
      attn_implementation: sdpa
      per_device_train_batch_size: 8
      gradient_accumulation_steps: 4
