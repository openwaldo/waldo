# python-bpe-v1: a Python model on join's BPE path. Starts from code-m0's round-5 merge (34M,
# 16K BPE trained on mixed code and English), pretrains on Python only with calmer settings and
# short rounds, then post-trains on python-basics-v4 and python-programs-v1 until 0.9 of 120
# held-out whole programs run correctly (the fixed evaluator, with structure checks).
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 1024
  vocabulary_size: 16384
  hidden_size: 512
  intermediate_size: 1536
  layers: 8
  attention_heads: 8
  key_value_heads: 4
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    training:  # the bootstrap trains it; every later round inherits it from its base
      algorithm: byte-bpe-v1
      sample_bytes: 67108864
      seed: 1
      max_token_inflation: 0
      distribution_policy: distributable
      filter:
        main_content: true
        sources:
          exclude: [OpenBSD/src, FreeBSD/src, NetBSD/src]
      corpora:
        - path: code/permissive
        - path: core/common-pile/libretexts
        - path: core/common-pile/pressbooks
        - path: core/common-pile/oercommons
        - path: core/common-pile/news
        - path: core/common-pile/python-enhancement-proposals
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: code/permissive
    parameters:
      profile: causal-pretrain-shuffled
      steps: 1000               # a single-model baseline's budget; join sets each unit's
      batch_size: 32
      sequence_length: 1024      # 32,768 tokens per step; a 6.5M-token round is ~199 steps
      learning_rate: 0.0006
      warmup_steps: 20
      weight_decay: 0.1
      evaluation_selection: lowest-sha256-v1
      evaluation_max_records: 256
      evaluation_max_bytes: 4194304
      shuffle_buffer_records: 1000000
      shuffle_buffer_bytes: 4294967296
  - name: sft
    type: fine-tuning
    objective: assistant-response-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    corpora:
      - path: /Users/mdagosta/.waldo/waldito/index-local/post-train/sft/python-basics-v4
      - path: /Users/mdagosta/.waldo/waldito/index-local/post-train/sft/python-programs-v1
    parameters:
      profile: causal-pretrain-shuffled
      epochs: 4
      batch_size: 16
      sequence_length: 1024
      learning_rate: 0.0003
      weight_decay: 0.05
      evaluation_fraction: 0.05
join:
  name: python-bpe-v1
  units:  # code-m0's Python repositories, balanced by tokens (~42M each)
    py-a:
      [ray-project/ray, langflow-ai/langflow, fastapi/fastapi, TheAlgorithms/Python,
       openai/whisper, hiyouga/LlamaFactory, psf/requests, D4Vinci/Scrapling,
       abi/screenshot-to-code, jingyaogong/minimind, nvbn/thefuck, microsoft/markitdown]
    py-b:
      [apache/superset, apache/airflow, d2l-ai/d2l-zh, PaddlePaddle/PaddleOCR, getredash/redash,
       pandas-dev/pandas, scrapy/scrapy, exo-explore/exo, harry0703/MoneyPrinterTurbo,
       pallets/flask, httpie/cli, deepseek-ai/DeepSeek-V3, xai-org/grok-1]
    py-c:
      [home-assistant/core, mem0ai/mem0, unslothai/unsloth, vllm-project/vllm, django/django,
       streamlit/streamlit, unclecode/crawl4ai, langchain-ai/langchain, browser-use/browser-use,
       Aider-AI/aider, 3b1b/manim, Z4nzu/hackingtool, TauricResearch/TradingAgents,
       xinntao/Real-ESRGAN, sherlock-project/sherlock]
  replicas: 2
  closers: 2
  claim_minutes: 150             # a pretraining unit is ~50 minutes at throttle 0.10
