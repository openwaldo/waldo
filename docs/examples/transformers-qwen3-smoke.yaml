# Custom Qwen3 CPU smoke test: random weights, not a pretrained Qwen checkpoint.
# Uses WALDO's byte tokenizer, NOT the standard pretrained Qwen tokenizer.
# Two optimizer steps verify mechanics, not language quality.
# Replace core/books with a small corpus available in your configured index.
kind: waldo-model-compose
schema: 2
training:
  engine: huggingface-transformers
  package:
    distribution: transformers
    version: 5.16.1
    artifact: transformers-5.16.1-py3-none-any.whl
    sha256: 2f2d5b98a5ad3718713653734298fa620754ed683702a635ebb587df3ed29c7e
architecture:
  provider: huggingface-transformers
  model_class: Qwen3ForCausalLM
  config_class: Qwen3Config
  config:
    model_type: qwen3
    vocab_size: 259
    hidden_size: 64
    intermediate_size: 160
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 16
    max_position_embeddings: 256
    attention_bias: false
    attention_dropout: 0.0
    tie_word_embeddings: true
    dtype: float32
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
  tokenizer:
    name: byte
    revision: builtin-byte-schema-1
stages:
  - name: qwen3-smoke
    type: pre-training
    objective: causal-language-modeling
    corpora: [core/books]
    parameters:
      steps: 2
      sequence_length: 32
      seed: 42
      evaluation_fraction: 0.1
      evaluation_max_records: 2
      evaluation_max_bytes: 65536
    trainer:
      class: Trainer
      arguments:
        per_device_train_batch_size: 2
        gradient_accumulation_steps: 1
        per_device_eval_batch_size: 2
        learning_rate: 0.001
        weight_decay: 0.01
        lr_scheduler_type: linear
        warmup_steps: 0
        logging_steps: 1
