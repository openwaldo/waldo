# Conversation level 3: a larger model built from the proven 0002 conversation
# curriculum, with technical and scientific knowledge as the majority.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 4096
  vocabulary_size: 50259
  hidden_size: 1536
  intermediate_size: 4096
  layers: 24
  attention_heads: 24
  key_value_heads: 8
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: core/books/gutenberg
        weight: 1
      - path: core/common-pile/wikimedia
        weight: 3
      - path: government/regulations
        weight: 1
      - path: science/plos
        weight: 3
      - path: core/synthetic/cosmopedia-v2
        weight: 5
      - path: core/common-pile/stackexchange
        weight: 5
    parameters:
      profile: causal-pretrain-weighted
      tokens: 18000000000
      batch_size: 16
      sequence_length: 4096
      learning_rate: 0.00011
      seed: 42
      weight_decay: 0.15
      warmup_steps: 2747
      shuffle_buffer_records: 65536
      shuffle_buffer_bytes: 2147483648
      checkpoint_every: 13733
      evaluate_every: 13733
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  # Follow the knowledge-heavy foundation with concrete systems code,
  # documentation, and a bounded amount of development discussion.
  - name: technical-knowledge-midtrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      languages:
        include: [en]
        include_unset: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - {path: code/copyleft/linux-core, weight: 4}
      - {path: code/permissive/linux-core, weight: 2}
      - {path: community/linux-kernel-mailing-list, weight: 3}
      - {path: code/stack-v2-html, weight: 1}
      - {path: code/cloud-native-core, weight: 1}
      - {path: community/git-mailing-list, weight: 1}
      - {path: community/python-mailing-lists, weight: 1}
    parameters:
      profile: causal-pretrain-weighted
      tokens: 3000000000
      batch_size: 8
      sequence_length: 4096
      learning_rate: 0.00002
      seed: 45
      weight_decay: 0.08
      warmup_steps: 916
      shuffle_buffer_records: 65536
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 4578
      evaluate_every: 4578
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: conversational-midtrain
    type: fine-tuning
    objective: causal-language-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/oasst1
        weight: 3
      - path: post-train/sft/oasst2
        weight: 5
      - path: post-train/sft/aya
        weight: 3
      - path: post-train/sft/dolly
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      epochs: 3
      batch_size: 8
      sequence_length: 4096
      learning_rate: 0.00003
      seed: 43
      weight_decay: 0.08
      warmup_steps: 305
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 536870912
      checkpoint_every: 1017
      evaluate_every: 1017
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: expanded-conversation-sft
    type: fine-tuning
    objective: assistant-response-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/tulu3
        weight: 6
      - path: post-train/sft/smol-smoltalk
        weight: 2
      - path: post-train/sft/ultrachat-200k
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      tokens: 400000000
      batch_size: 8
      sequence_length: 4096
      learning_rate: 0.00001
      seed: 46
      weight_decay: 0.04
      warmup_steps: 122
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 536870912
      checkpoint_every: 610
      evaluate_every: 610
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  # Finish with the same bounded behavior anchor that made 0002 conversation
  # useful. Narrow alignment belongs after broad and technical learning.
  - name: post-train
    type: fine-tuning
    objective: causal-language-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/interaction-contract-v1
        weight: 8
      - path: post-train/sft/helpsteer2
        weight: 3
    parameters:
      profile: causal-pretrain-weighted
      epochs: 3
      batch_size: 8
      sequence_length: 4096
      learning_rate: 0.000008
      seed: 44
      weight_decay: 0.05
      warmup_steps: 48
      shuffle_buffer_records: 16384
      shuffle_buffer_bytes: 268435456
      checkpoint_every: 80
      evaluate_every: 80
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432
