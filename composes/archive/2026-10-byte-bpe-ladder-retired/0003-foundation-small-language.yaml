# Archived Gate 3: test language acquisition at ~76M without the PLOS domain stream.
kind: waldo-model-compose
schema: 1
architecture:
  family: decoder-transformer
  context_tokens: 1024
  vocabulary_size: 16000
  hidden_size: 640
  intermediate_size: 1792
  layers: 15
  attention_heads: 10
  key_value_heads: 2
  dropout: 0.0
  qk_normalization: true
  initialization: depth-scaled
  tie_embeddings: true
  parameter_dtype: float32
  tokenizer:
    training:
      algorithm: byte-bpe-v1
      sample_bytes: 268435456
      seed: 42
      max_token_inflation: 0.35
      distribution_policy: distributable
      filter:
        main_content: true
        exclude:
          repetitive_content: true
          boilerplate_content: true
      corpora:
        - core/common-pile/wikimedia
        - core/common-pile/pressbooks
        - science/plos
stages:
  - name: foundation-pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: core/common-pile/wikimedia
        weight: 1
      - path: core/common-pile/pressbooks
        weight: 1
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 760000000
      batch_size: 64
      gradient_accumulation_steps: 4
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: false
      sequence_length: 1024
      learning_rate: 0.00025
      optimizer: adamw
      schedule: warmup-stable-warmdown
      seed: 42
      weight_decay: 0.1
      warmup_steps: 580
      warmdown_steps: 2319
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 500
      evaluate_every: 500
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
