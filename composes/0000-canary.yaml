# Private system gate: exercise the complete training and inference path cheaply.
# Model artifacts are non-distributable pending review of HelpSteer2's
# user-contributed ShareGPT prompt provenance.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 512
  vocabulary_size: 100259
  hidden_size: 128
  intermediate_size: 384
  layers: 4
  attention_heads: 4
  key_value_heads: 2
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/cl100k_base
    revision: tiktoken-cl100k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
    corpora:
      - post-train/sft/helpsteer2
      - post-train/sft/interaction-contract-v1
      - post-train/sft/waldo-project-v1
      - post-train/conversation/schema-guided-dialogue
      - post-train/conversation/ccpe
    parameters:
      profile: causal-pretrain-balanced
      parallelism: auto
      tokens: 4096000
      batch_size: 32
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: false
      compile: false
      sequence_length: 512
      learning_rate: 0.0003
      optimizer: adamw
      schedule: cosine
      seed: 42
      warmup_steps: 25
      checkpoint_every: 50
      evaluate_every: 50
      evaluation_max_records: 128
      evaluation_max_bytes: 4194304
