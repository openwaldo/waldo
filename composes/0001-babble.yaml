# Candidate first useful model: learn coherent language, then basic interaction.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 1024
  vocabulary_size: 50259
  hidden_size: 640
  intermediate_size: 1792
  layers: 10
  attention_heads: 10
  key_value_heads: 2
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: core/books/gutenberg
        weight: 3
      - path: core/common-pile/wikimedia
        weight: 4
      - path: science/plos
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 559972352
      batch_size: 32
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      distribution_policy: distributable
      sequence_length: 1024
      learning_rate: 0.00025
      optimizer: adamw
      schedule: cosine
      seed: 42
      weight_decay: 0.12
      warmup_steps: 342
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 1073741824
      checkpoint_every: 1709
      evaluate_every: 1709
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216

  - name: conversational-midtrain
    type: fine-tuning
    objective: assistant-response-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/oasst1
        weight: 3
      - path: post-train/sft/oasst2
        weight: 4
      - path: post-train/sft/dolly
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 29999104
      batch_size: 16
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      distribution_policy: distributable
      sequence_length: 1024
      learning_rate: 0.000035
      optimizer: adamw
      schedule: cosine
      seed: 43
      weight_decay: 0.06
      warmup_steps: 37
      shuffle_buffer_records: 16384
      shuffle_buffer_bytes: 268435456
      checkpoint_every: 366
      evaluate_every: 366
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216

  - name: post-train
    type: fine-tuning
    objective: assistant-response-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/interaction-contract-v1
        weight: 5
      - path: post-train/sft/helpsteer2
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 9994240
      batch_size: 16
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      distribution_policy: distributable
      sequence_length: 1024
      learning_rate: 0.000012
      optimizer: adamw
      schedule: cosine
      seed: 44
      weight_decay: 0.04
      warmup_steps: 12
      shuffle_buffer_records: 8192
      shuffle_buffer_bytes: 134217728
      checkpoint_every: 122
      evaluate_every: 122
      evaluation_max_records: 512
      evaluation_max_bytes: 16777216
