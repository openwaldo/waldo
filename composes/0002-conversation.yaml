# Conversation level 2: bounded 2.4B-token capability experiment.
# This is a private research compose pending record-level rights work for
# Gutenberg, federal rulemaking, PLOS, and HelpSteer2. Its model artifacts
# must not be represented or released as distributable.
kind: waldo-model-compose
schema: 1
interaction:
  template: user-assistant-v1
architecture:
  family: decoder-transformer
  context_tokens: 2048
  vocabulary_size: 50259
  hidden_size: 1152
  intermediate_size: 3072
  layers: 20
  attention_heads: 16
  key_value_heads: 4
  dropout: 0.1
  tie_embeddings: true
  parameter_dtype: bfloat16
  tokenizer:
    name: tiktoken/r50k_base
    revision: tiktoken-r50k-base
stages:
  - name: pretrain
    type: pre-training
    objective: causal-language-modeling
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: core/books/gutenberg
        weight: 3
      - path: core/common-pile/wikimedia
        weight: 4
      - path: government/regulations
        weight: 1
      - path: science/plos
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 2199977984
      batch_size: 16
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      sequence_length: 2048
      learning_rate: 0.00013
      optimizer: adamw
      schedule: cosine
      seed: 42
      weight_decay: 0.15
      warmup_steps: 1343
      shuffle_buffer_records: 65536
      shuffle_buffer_bytes: 2147483648
      checkpoint_every: 6714
      evaluate_every: 6714
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: conversational-midtrain
    type: fine-tuning
    objective: causal-language-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/oasst1
        weight: 3
      - path: post-train/sft/oasst2
        weight: 5
      - path: post-train/sft/aya
        weight: 3
      - path: post-train/sft/dolly
        weight: 2
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 149995520
      batch_size: 8
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      sequence_length: 2048
      learning_rate: 0.00004
      optimizer: adamw
      schedule: cosine
      seed: 43
      weight_decay: 0.08
      warmup_steps: 183
      shuffle_buffer_records: 32768
      shuffle_buffer_bytes: 536870912
      checkpoint_every: 916
      evaluate_every: 916
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432

  - name: post-train
    type: fine-tuning
    objective: causal-language-modeling
    conversation:
      template: user-assistant-v1
      supervised_roles: [assistant]
    filter:
      main_content: true
      exclude:
        repetitive_content: true
        boilerplate_content: true
    corpora:
      - path: post-train/sft/interaction-contract-v1
        weight: 8
      - path: post-train/sft/helpsteer2
        weight: 3
      - path: post-train/sft/waldo-project-v1
        weight: 1
    parameters:
      profile: causal-pretrain-weighted
      parallelism: auto
      tokens: 49987584
      batch_size: 8
      gradient_accumulation_steps: 1
      compute_precision: bfloat16
      activation_checkpointing: true
      compile: true
      sequence_length: 2048
      learning_rate: 0.000015
      optimizer: adamw
      schedule: cosine
      seed: 44
      weight_decay: 0.05
      warmup_steps: 61
      shuffle_buffer_records: 16384
      shuffle_buffer_bytes: 268435456
      checkpoint_every: 305
      evaluate_every: 305
      evaluation_max_records: 1024
      evaluation_max_bytes: 33554432
